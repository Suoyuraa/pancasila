let answered=0, score=0;

function render(){
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  questions.forEach((item,i)=>{
    const card=document.createElement('section');
    card.className='card';
    card.id='q'+i;
    const options=item.options.map((op,j)=>`
      <button class="option" data-q="${i}" data-o="${j}" onclick="choose(${i},${j})">
        <span class="letter">${String.fromCharCode(65+j)}.</span>${op}
      </button>`).join('');
    const exp=item.exp.map((x,j)=>`<div><strong>${String.fromCharCode(65+j)}.</strong> ${x}</div>`).join('');
    card.innerHTML=`
      <div class="qnum">SOAL ${i+1}</div>
      <h2 class="question">${item.q}</h2>
      ${item.source ? `<div class="source">${item.source}</div>`:''}
      <div class="options">${options}</div>
      <div class="explanation" id="exp${i}">
        <div style="margin-bottom:10px"><strong>Jawaban benar: ${String.fromCharCode(65+item.answer)}</strong></div>
        ${exp}
      </div>
    `;
    quiz.appendChild(card);
  });
  updateProgress();
}

function choose(qIndex,optIndex){
  const card=document.getElementById('q'+qIndex);
  if(card.dataset.done==='1') return;
  card.dataset.done='1';
  answered++;
  const item=questions[qIndex];
  const buttons=card.querySelectorAll('.option');
  buttons.forEach((b,j)=>{
    b.disabled=true;
    if(j===item.answer) b.classList.add('correct');
    if(j===optIndex && j!==item.answer) b.classList.add('wrong');
    if(j===optIndex) b.classList.add('selected');
  });
  if(optIndex===item.answer) score++;
  document.getElementById('exp'+qIndex).classList.add('show');
  updateProgress();
  if(answered===questions.length) showResult();
}

function updateProgress(){
  const n=answered+1;
  document.getElementById('progressText').textContent =
    answered===questions.length ? 'Semua soal selesai' : `Terjawab ${answered} dari ${questions.length}`;
  document.getElementById('scoreText').textContent=`Skor: ${score}`;
  document.getElementById('bar').style.width=(answered/questions.length*100)+'%';
}

function showResult(){
  const box=document.getElementById('result');
  box.classList.add('show');
  document.getElementById('finalScore').textContent=`${score}/${questions.length}`;
  let msg='';
  const p=score/questions.length*100;
  if(p>=90) msg='Mantap! Pemahamanmu sudah sangat kuat.';
  else if(p>=75) msg='Bagus! Tinggal perkuat beberapa bagian yang masih keliru.';
  else if(p>=60) msg='Lumayan. Ulangi soal yang salah dan perhatikan pembahasannya.';
  else msg='Tidak apa-apa. Gunakan pembahasan sebagai bahan belajar lalu coba lagi.';
  document.getElementById('finalMessage').textContent=msg;
  box.scrollIntoView({behavior:'smooth'});
}

render();
</script>
